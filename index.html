<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יום מחקר בתיכון אופק — משחק שיטות מחקר</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --panel: #ffffff;
  --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #8a887f;
  --series-1: #2a78d6; --accent-soft: #e8f0fb;
  --line: #e4e2da; --sel: #2a78d6; --warn: #b3560f;
  --radius: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-1); color: var(--ink-1);
  font-family: "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
  font-size: 16px; line-height: 1.55;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
.hero { text-align: center; padding: 28px 8px 6px; }
.kicker { color: var(--series-1); font-weight: 700; letter-spacing: .06em; font-size: .85rem; }
h1 { margin: .2em 0 .3em; font-size: 2rem; }
h2 { font-size: 1.2rem; margin: 0 0 .5em; }
h3 { font-size: 1rem; margin: 1em 0 .4em; color: var(--ink-2); }
.substep { font-size: .85rem; font-weight: 600; margin: .9em 0 .2em; color: var(--ink-3);
  letter-spacing: .02em; }
.lead { color: var(--ink-2); max-width: 640px; margin: 0 auto 10px; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; margin: 14px 0;
}
.opt { color: var(--ink-3); font-weight: 400; font-size: .85em; }
.hint { color: var(--ink-2); font-size: .9rem; }
.foot { text-align: center; color: var(--ink-3); font-size: .8rem; }
.txt { width: 220px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; font-family: inherit; }
.tguide { margin-top: 10px; color: var(--ink-2); font-size: .9rem; }
.tguide summary { cursor: pointer; color: var(--series-1); font-weight: 600; }

.cards3, .cards2 { display: grid; gap: 10px; margin: 10px 0; }
.cards3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.cards2 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card {
  text-align: start; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; font-family: inherit; font-size: .92rem; line-height: 1.4;
}
.card b { display: block; margin-bottom: 3px; }
.card span { color: var(--ink-2); font-size: .85rem; }
.card:hover { border-color: var(--series-1); }
.card.sel { border-color: var(--sel); background: var(--accent-soft); }
.rqcard { display: flex; align-items: center; min-height: 76px; }
.rqtext { color: var(--ink-1); font-size: .95rem; line-height: 1.4; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.btn {
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 18px;
  font-family: inherit; font-size: .95rem; cursor: pointer; font-weight: 600;
}
.btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.btn.primary:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { color: var(--ink-2); }
.btn.big { padding: 13px 26px; font-size: 1.05rem; }

.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  font-size: .9rem;
}
.rqtag { color: var(--ink-2); }
.timebar { display: flex; align-items: center; gap: 4px; }
.slot { width: 18px; height: 10px; border-radius: 4px; background: var(--series-1); display: inline-block; }
.slot.used { background: var(--line); }
.tlabel { color: var(--ink-2); font-size: .8rem; margin-inline-start: 8px; }

.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
.action {
  display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: start;
  border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--panel);
  padding: 12px 14px; cursor: pointer; font-family: inherit; font-size: .9rem;
}
.action:hover { border-color: var(--series-1); }
.action.off { opacity: .45; cursor: not-allowed; }
.aicon { font-size: 1.4rem; }
.asub { color: var(--ink-2); font-size: .82rem; }
.cost { color: var(--ink-3); font-size: .78rem; }

.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.pers {
  text-align: start; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel);
  padding: 8px 10px; cursor: pointer; font-family: inherit; font-size: .85rem;
}
.pers b { display: block; }
.pers span { color: var(--ink-2); font-size: .78rem; }
.pers:hover { border-color: var(--series-1); }
.pers.sel { border-color: var(--sel); background: var(--accent-soft); }
.pers.done { border-style: dashed; opacity: .75; }

.quote {
  background: var(--accent-soft); border-inline-start: 3px solid var(--series-1);
  border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: .93rem;
}
.quote.small { font-size: .85rem; padding: 7px 12px; }
.qa { margin: 10px 0; }
.q { color: var(--ink-2); font-size: .88rem; margin-bottom: 2px; }
.q::before { content: "🎙️ "; }
.a { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: .93rem; }
.wordpick { border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; }
.wbtn {
  display: block; width: 100%; text-align: start; margin: 6px 0; padding: 9px 12px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--panel);
  font-family: inherit; font-size: .9rem; cursor: pointer;
}
.wbtn:hover { border-color: var(--series-1); }
.wbtn.warn:hover { border-color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; align-items: center; font-size: .88rem; }
.chip {
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 13px;
  font-family: inherit; font-size: .85rem; cursor: pointer;
}
.chip:hover { border-color: var(--series-1); }
.chip.sel { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.fgline { margin: 6px 0; font-size: .92rem; }
.fgline.mute { color: var(--ink-3); font-style: italic; }

.ecard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; margin: 8px 0; font-size: .87rem; }
.ecard p { margin: 4px 0; color: var(--ink-2); }
.etag { color: var(--series-1); font-size: .75rem; font-weight: 700; }

.bars { margin: 12px 0; }
.brow { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(120px, 2fr) 44px; gap: 10px; align-items: center; margin: 7px 0; }
.blabel { font-size: .86rem; color: var(--ink-1); }
.btrack { background: var(--line); border-radius: 4px; height: 12px; overflow: hidden; display: block; }
.bfill { background: var(--series-1); height: 100%; display: block; border-radius: 4px; }
.bval { font-size: .85rem; color: var(--ink-1); font-variant-numeric: tabular-nums; }

.claim { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.claim:first-of-type { border-top: 0; }
.conf { color: var(--ink-2); }

.srow { display: grid; grid-template-columns: 170px 1fr 46px; gap: 10px; align-items: center; margin: 10px 0 2px; }
.slabel { font-weight: 600; font-size: .9rem; }
.sbar { background: var(--line); border-radius: 4px; height: 12px; overflow: hidden; display: block; }
.sfill { background: var(--series-1); height: 100%; display: block; border-radius: 4px; }
.sval { font-size: .85rem; }
.snote { grid-column: 1 / -1; color: var(--ink-2); font-size: .85rem; margin: 0 0 6px; }
.snote ul { margin: 4px 0 10px; padding-inline-start: 20px; }
.snote li { margin-bottom: 3px; }
.snote b { color: var(--ink-1); }
.reveal { background: #fbf7ee; }
.chose { font-size: .9rem; color: var(--ink-2); margin: 0 0 .4em; }
.chose b { color: var(--ink-1); }
.strengthhead { font-size: 1rem; color: var(--ink-1); margin: 1.1em 0 .5em; }
.strengths { margin: 0 0 1em; padding-inline-start: 20px; display: grid; gap: 6px; font-size: .92rem; }
.tri-note { border-inline-start: 3px solid var(--series-1); background: var(--accent-soft);
  border-radius: 0 8px 8px 0; padding: 14px 18px; margin-top: 12px; font-size: .92rem; }
.tri-note ul { margin: .5em 0; padding-inline-start: 20px; display: grid; gap: 8px; }
.tri-note p:last-child { margin-bottom: 0; }
.rcard { width: 100%; min-height: 130px; font-family: inherit; font-size: .85rem; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

.mback { position: fixed; inset: 0; background: rgba(11,11,11,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--panel); border-radius: var(--radius); max-width: 620px; max-height: 82vh; overflow: auto; padding: 20px 22px; }
.modal p { font-size: .9rem; color: var(--ink-1); }

.langbar { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: flex; justify-content: flex-start; direction: ltr; }
.langbtn { padding: 7px 16px; font-size: .9rem; }
.langbtn:hover { border-color: var(--series-1); }
</style>
</head>

    neta: {

    orly: {

    sigalit: {
      name: "Sigalit Dahan", tag: "School counselor",
      bio: "Knows more than anyone about the emotional impact and is bound by absolute confidentiality. Sees overload and loneliness where others see cheating.",

        use: { h: "Let's agree up front: I won't talk about specific students. About patterns — yes.", g: "I see students using it, like everyone else does.", o: "Students use it within the rules." },
        learning: { h: "What I see isn't cheating. It's exhausted kids who found a way to survive a week with seven assignments. That's not the same story.", g: "It affects different students in different ways.", o: "We support the students." },
        assess: { h: "Students have come to me after disciplinary inquiries on this. I'll say only this: the emotional damage there was greater than the offense.", g: "Assessment generates considerable pressure among students.", o: "The inquiry procedures are conducted properly." },
        policy: { h: "The policy talks about integrity. It doesn't talk about a sixteen-year-old sitting up at two in the morning talking to a machine because he has no one else to talk to.", g: "The policy doesn't address the emotional aspects at all.", o: "We have a proper policy in place." },
        feelings: { h: "The ones who worry me most are the kids who use it as a listening ear. That's not a question of cheating. It's a question of loneliness.", g: "There are emotional aspects that aren't talked about enough.", o: "We monitor student wellbeing." },
      },
      gShort: { h: "I say this carefully: we are holding a discussion about integrity, and the kids are living through a crisis of overload and loneliness. It's not the same discussion.", g: "We should consider the emotional aspects." },
      card: "Knows the most and is bound by confidentiality; sees overload and loneliness where the system sees cheating.",
      probe: { hint: "ask about patterns, not cases", text: "No names and no cases — what kinds of situations keep recurring for you?", reveal: "Sigalit sighs. “Three kinds. A boy who uses it because he isn't sleeping. A girl who got caught and hasn't raised her hand in class since. And a boy who tells the chatbot things he's never told any person. None of the three appears in any report.”" },
    },

    chani: {
      name: "Chani Stern", tag: "Measurement and assessment coordinator",
      bio: "Holds the only quantitative evidence in the school. Presented it once, a year and a half ago, and nothing happened.",
      D: {
        use: { h: "I use it a little, for data analysis. That's not the discussion that interests me.", g: "Measured use.", o: "As professionally needed." },
        learning: { h: "I don't know whether it improves learning. That's exactly the problem — nobody knows, and we've been running a flagship program for three years.", g: "We have no metrics that would let us answer that.", o: "The program is professionally monitored." },
        assess: { h: "I have the data. The average homework grade has risen eleven points in two years. Exam scores haven't moved, and in two subjects they've dropped. I showed this to the principal a year and a half ago.", g: "There are gaps between assignment grades and exam grades that are worth examining.", o: "We are tracking the data." },
        policy: { h: "Policy without measurement is a declaration of intent. I wrote that in my comments on the document. The comment didn't make it in.", g: "The policy doesn't include success metrics.", o: "There is an approved policy document." },
        feelings: { h: "It troubles me that we're making a big pedagogical bet and choosing not to measure it. This isn't a question of for or against. It's a question of professional responsibility.", g: "I'd like more measurement.", o: "I'm at peace with the process." },
      },
      gShort: { h: "I'll present one fact: an eleven-point gap between assignment grades and exam grades, two years running. You can argue about the interpretation. You can't argue about the number.", g: "I'd be glad if we based the discussion on data rather than on feelings." },
      card: "Holds the only quantitative evidence in the school; presented it once and it was buried.",
      probe: { hint: "ask to see the data itself", text: "Is there data I could see?", reveal: "Chani opens a file without hesitation. “Homework average: 78 two years ago, 89 today. Internal exam average in the same subjects: 71, then 69. I asked myself five alternative questions before drawing a conclusion. You're welcome to ask them too.”" },
    },

        policy: { h: "The document is in my folder. Three people have asked me for a copy in two years — that's what I can say about it.", g: "There's a document in the folder.", o: "Everything is filed as required." },

    amal: {

    galit: {
      name: "Galit Rosenstein", tag: "Inclusion coordinator",
      bio: "Sees the tool as the accessibility achievement of her professional life, and admits she can't tell an assistive tool from a tool that does the work in the students' place.",
      D: {
        use: { h: "Nonstop, and together with my students. Read-aloud, simplification, a structure generator. That's accessibility, not cheating.", g: "I use it in my work with the inclusion students.", o: "In line with the approved accommodations." },
        learning: { h: "I have six students whose work has been completely transformed. It's the most significant progress in accessibility I've seen in my career. Period.", g: "It helps my students a great deal.", o: "We're seeing improvement." },
        assess: { h: "And also — and I say this out loud — there are two who have stopped trying on their own. I can't always tell the difference between an assistive tool and a tool that does the work in the students' place. Anyone who says they can is lying.", g: "There's a grey area between using AI for help and cheating.", o: "The accommodations are implemented as required." },
        policy: { h: "Every conversation about ‘integrity’ here treats my students as suspects by default. I fight that in every meeting.", g: "The policy doesn't distinguish between cheating and accommodation.", o: "There's a policy and we act according to it." },
        feelings: { h: "I'm afraid of the day someone decides to ban the one thing that worked. I came to Israel at twelve without a word of Hebrew, and they put me two years below my level. I won't let that happen to any child I can reach.", g: "It's important to me that the accommodations are kept.", o: "I trust the system." },
      },
      gShort: { h: "I'll oppose any total ban. This is the biggest advance in accessibility I've seen. And in the same breath — two of my students have stopped trying on their own, and I'm not hiding that.", g: "For the inclusion students it's critical, and I'll fight for it." },
      card: "Sees the tool as the accessibility achievement of her life and admits she can't tell an assistive tool from a tool that does the work in the students' place.",
    },
    kobi: {
      name: "Kobi Elimelech", tag: "PE teacher and grade-level coordinator",

        policy: { h: "I'm a grade-level coordinator, and I wasn't invited to a single discussion on the subject. The decisions get made in forums I don't sit in, and afterwards I'm the one dealing with the students.", g: "I wasn't in the discussions about it.", o: "I'm aligned with management." },
        feelings: { h: "What annoys me is that the whole argument in the staff room is disconnected from the kids themselves. Nobody asked them why.", g: "I'd be glad if they were asked too.", o: "I have nothing to add." },
      },
      gShort: { h: "I'll say it simply: they're not cheaters, they're exhausted. Sit with them on the bus after a game and you'll understand.", g: "I see it mostly from the students' side, less from the side of the subject matter." },
      card: "A grade-level coordinator students talk to without putting on a show; sees fatigue where others see cheating, and has never been asked.",
      probe: { hint: "ask what students tell him in particular", text: "What do they tell you that they don't tell other teachers?", reveal: "Kobi leans back. “That they don't sleep. That there's a WhatsApp group with prompts for every assignment. That one of them is so stressed he can no longer start anything on his own. I hear it every week on the bus. You're the first person in the building to ask me, and I've been here twelve years.”" },
    },
    michal: {
      name: "Michal Adler", tag: "Civics teacher",
      bio: "Her concern is bias and misinformation, not cheating; candidly admits she finds it hard to tell bias in an AI-written text from her own bias that comes from disagreeing with what's written.",
      D: {
        use: { h: "Yes, and deliberately in front of the class: I generate a biased summary with it and we analyze it together. I need it in the room in order to warn against it.", g: "I use it as a teaching tool.", o: "Within civics lessons." },
        learning: { h: "They get fluent output and assume it's neutral. The fluency is exactly what hides the bias.", g: "There's a problem of accepting information uncritically.", o: "We're developing critical thinking." },
        assess: { h: "Cheating doesn't particularly interest me, and that's not a popular thing to say in the staff room.", g: "I'm less preoccupied with the cheating question.", o: "Assessment is proceeding as usual." },
        policy: { h: "The policy is entirely about integrity and doesn't contain a word about misinformation. That's what happens when you write a document out of fear rather than out of thought.", g: "The policy doesn't touch on the information aspects at all.", o: "There is a policy." },
        feelings: { h: "And I'll say the uncomfortable part too: I mark output as ‘biased’ according to my political intuition. I can't always tell bias in an AI-written text from my own bias that comes from disagreeing with what's written. I don't always know whether the text really is biased, or whether it just seems biased to me because I don't agree with the position it presents. That troubles me.", g: "There's a question of who decides what counts as biased.", o: "We teach media literacy." },
      },
      gShort: { h: "We argue about cheating and miss the story: students are getting wrong political information delivered with total confidence. And I myself can't always tell bias from my own disagreement.", g: "My concern lies in a completely different direction — information, not cheating." },
      card: "Her concern is bias and misinformation, not cheating. She admits she can't always tell whether an AI-written text is biased or whether she just disagrees with it.",
    },
    eliya: {

    itamar: {
      name: "Itamar Klein", tag: "Student, 11th grade",

// ===== Language switching (Hebrew ⇄ English) =====
// The game starts in Hebrew. setLang() overlays the chosen pack onto the live data
// objects above, flips the page direction, and re-renders. Everything kept in game
// state (evidence, interview logs, focus-group transcripts) is stored as language-neutral
// references and resolved to text at render time, so a switch mid-game translates
// what has already been collected as well.
let LANG = "he";
const L = (he, en) => (LANG === "en" ? en : he);
const qt = (s) => (LANG === "en" ? "“" + s + "”" : "״" + s + "״");

const HE_PACK = (function () {
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const chars = {};
  CHARACTERS.forEach((c) => {
    chars[c.id] = clone({ name: c.name, tag: c.tag, bio: c.bio, D: c.D, gShort: c.gShort, echo: c.echo, card: c.card, probe: c.probe });
  });
  const survey = {};
  Object.keys(SURVEY).forEach((k) => {
    survey[k] = { short: SURVEY[k].short, title: SURVEY[k].title, items: SURVEY[k].items.map((it) => it.label) };
  });
  const claims = {}, reveals = {}, rqs = {};
  CLAIMS.forEach((c) => { claims[c.id] = { text: c.text, basis: c.basis }; });
  REVEALS.forEach((r) => { reveals[r.key] = r.text; });
  Object.keys(RQS).forEach((k) => { rqs[k] = RQS[k].text; });
  return {
    TOPICS: clone(TOPICS), CHARACTERS: chars, GROUP_OPENERS: clone(GROUP_OPENERS),
    OBSERVATIONS: clone(OBSERVATIONS), CORRIDOR: CORRIDOR.slice(), SURVEY: survey,
    CLAIMS: claims, GUIDE: clone(GUIDE), REVEALS: reveals, ROLES: clone(ROLES), RQS: rqs,
  };
})();

function overlay(dst, src) {
  Object.keys(src).forEach((k) => {
    const v = src[k];
    if (v && typeof v === "object" && dst[k] && typeof dst[k] === "object") overlay(dst[k], v);
    else dst[k] = v;
  });
}

function applyPack(P) {
  overlay(TOPICS, P.TOPICS);
  CHARACTERS.forEach((c) => {
    overlay(c, P.CHARACTERS[c.id]);
    if (c.gOpen && P.GROUP_OPENERS[c.id]) overlay(c.gOpen, P.GROUP_OPENERS[c.id]);
  });
  overlay(OBSERVATIONS, P.OBSERVATIONS);
  P.CORRIDOR.forEach((s, i) => { CORRIDOR[i] = s; });
  Object.keys(SURVEY).forEach((k) => {
    SURVEY[k].short = P.SURVEY[k].short;
    SURVEY[k].title = P.SURVEY[k].title;
    SURVEY[k].items.forEach((it, i) => { it.label = P.SURVEY[k].items[i]; });
  });
  CLAIMS.forEach((c) => overlay(c, P.CLAIMS[c.id]));
  overlay(GUIDE, P.GUIDE);
  REVEALS.forEach((r) => { r.text = P.REVEALS[r.key]; });
  overlay(ROLES, P.ROLES);
  Object.keys(RQS).forEach((k) => { RQS[k].text = P.RQS[k]; });
}

function setLang(lang) {
  if (lang !== "he" && lang !== "en") return;
  LANG = lang;
  applyPack(lang === "en" ? EN_PACK : HE_PACK);
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "en" ? "ltr" : "rtl";
  document.title = L("יום מחקר בתיכון אופק — משחק שיטות מחקר", "A Research Day at Ofek High School — A Research Methods Game");
  if (S && S.scores) S.scores = computeScores(); // the debrief notes are text: rebuild them in the new language
  render();
  const btn = document.getElementById("langbtn");
  if (btn) btn.focus();
}

// ===== יום מחקר — engine + UI =====
"use strict";

// ---------- seeded RNG (classroom mode) ----------
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^= h >>> 16) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- state ----------
let S = null;
const byId = (id) => CHARACTERS.find((c) => c.id === id);

function newGame(code, role, rq) {
  const seedTxt = (code || "דמו").trim() || "דמו";
  const rng = mulberry32(hashStr(seedTxt));
  // seeded world variation: survey jitter + corridor order
  const jitter = {};
  Object.keys(SURVEY).forEach((pop) => {
    jitter[pop] = SURVEY[pop].items.map(() => Math.round((rng() - 0.5) * 10));
  });
  const corridorOrder = CORRIDOR.map((_, i) => i)
    .sort(() => rng() - 0.5);
  S = {
    code: seedTxt, role, rq, time: 8, screen: "day", view: { name: "hub" },
    jitter, corridorOrder, corridorUsed: 0,
    evidence: [], interviewed: [], observed: [], focusRuns: [], surveys: [],
    leadingCount: 0, probesFound: [], askedTopics: {}, // charId -> [topicIds]
    ivTypes: [], obsModes: [], // which interview / observation variants were used
    answers: null, scores: null,
  };
}

function spend(cost) { S.time -= cost; }
function canAfford(cost) { return S.time >= cost; }

function addEvidence(card) { S.evidence.push(card); }

// ---------- dialogue resolution ----------
function baseLevel(ch) { return ch.open[S.role]; } // 0 o / 1 g / 2 h
function variantOf(level) { return level >= 2 ? "h" : level >= 1 ? "g" : "o"; }

function interviewVariant(ch, topicId, wording, type) {
  let lvl = baseLevel(ch);
  if (type === "structured") lvl = Math.min(lvl, 1);
  if (wording === "leading") {
    S.leadingCount++;
    if (ch.influence < 2) lvl = Math.max(0, lvl - 1);
  }
  return variantOf(lvl); // only the variant key is stored; logQA() turns it into text when rendering
}
// An interview log entry is { topic, wording, variant } or { probe: true }.
function logQA(ch, l) {
  if (l.probe) return { q: ch.probe.text, a: ch.probe.reveal, probe: true };
  return { q: TOPICS[l.topic][l.wording === "leading" ? "qLeading" : "qNeutral"], a: ch.D[l.topic][l.variant] };
}

function probeAvailable(ch, type) {
  if (!ch.probe || type === "structured") return false;
  const roles = {
    yael: ["out", "tch", "mgmt"], moshe: ["out"], david: ["out"], roni: ["out"], rami: ["out"],
    yossi: ["out", "tch"], noa: ["out", "tch", "mgmt"],
    // expansion cast
    orly: ["out"], sigalit: ["out", "tch"], itai: ["out", "tch", "mgmt"], chani: ["out", "tch", "mgmt"],
    vered: ["out", "tch", "mgmt"],
    amal: ["out"], kobi: ["out", "tch"], eliya: ["out", "tch"], daniel: ["out"],
    tamara: ["out", "tch"], itamar: ["out"], salma: ["out"], yonatan: ["out"],
  };
  return (roles[ch.id] || ["out"]).includes(S.role);
}

// ---------- focus group transcript ----------
function focusTranscript(members, written, ordered) {
  const present = members.map(byId);
  const ids = members;
  const lines = [];
  const silenced = [];
  // argument moment
  if (ids.includes("noa") && ids.includes("avi")) {
    lines.push({ id: "noa", src: "arg" });
    lines.push({ id: "avi", src: "arg" });
  }
  const order = ordered ? present.slice() : present.slice().sort((a, b) => b.influence - a.influence);
  let lastDominant = null;
  order.forEach((ch) => {
    if (ids.includes("noa") && ids.includes("avi") && (ch.id === "noa" || ch.id === "avi")) { lastDominant = ch; return; }
    const silencerHere = (ch.silencedBy || []).some((s) => ids.includes(s));
    if (silencerHere && !ordered) {
      lines.push({ id: ch.id, src: "mute", mute: true });
      silenced.push(ch.id);
      return;
    }
    if (ch.conform === 2 && lastDominant && ch.echo) {
      lines.push({ id: ch.id, src: "echo", key: ch.echo[lastDominant.id] ? lastDominant.id : "generic" });
      return;
    }
    let lvl = 2; // peer context default
    if (S.role === "mgmt" && ch.open.mgmt === 0) lvl = 1;
    if (silencerHere && ordered) lvl = Math.min(lvl, 1);
    if (!ordered && ch.influence === 0 && present.some((p) => p.influence === 2)) lvl = Math.min(lvl, 1);
    if (ch.performs) lvl = Math.min(lvl, 1); // keeps up a front in any spoken setting; truth appears only on a written card
    // The first two speakers cannot refer to a discussion that has not happened yet:
    // they get a standalone opening version of their line where one exists.
    const variant = lvl >= 2 ? "h" : "g";
    const opening = lines.filter((l) => !l.mute).length < 2;
    const src = (opening && ch.gOpen && ch.gOpen[variant]) ? "gOpen" : "gShort";
    lines.push({ id: ch.id, src, key: variant });
    if (ch.influence === 2) lastDominant = ch;
  });
  let cards = null;
  if (written) {
    cards = present.map((ch) => ch.id).sort(() => 0.5 - Math.random()); // ids; the card text is read at render time
  }
  return { lines, cards, silenced };
}
// Transcript lines are stored as { id, src, key } and turned into text here, in the current language.
const FG_ARGUMENT = {
  noa: () => L("השאלה היא רק איך משתמשים נכון, לא אם. מי שמפחד — שיבוא לראות שיעור אצלי.", "The only question is how to use it properly, not whether. Anyone who's afraid — come and watch one of my lessons."),
  avi: () => L("זה בדיוק העניין, נועה: את מציגה את הפחד כבעיה היחידה. ויתור על מאמץ הוא לא פחד, הוא מחיר.", "That's exactly the point, Noa: you present fear as the only problem. Giving up effort isn't fear, it's a price."),
};
function fgLine(l) {
  const ch = byId(l.id);
  let text;
  if (l.src === "arg") text = FG_ARGUMENT[l.id]();
  else if (l.src === "mute") text = L("(שותק/ת, מביט/ה בשולחן)", "(silent, eyes on the table)");
  else text = ch[l.src][l.key];
  return { who: ch.name, tag: ch.tag, text, mute: !!l.mute };
}

// ---------- survey ----------
function surveyResults(pop) {
  const src = SURVEY[pop];
  return {
    title: src.title, n: src.n,
    items: src.items.map((it, i) => ({ label: it.label, pct: Math.max(3, Math.min(97, it.pct + S.jitter[pop][i])) })),
  };
}

// ---------- coverage + scoring ----------
function heardIds() {
  const set = new Set(S.interviewed);
  S.focusRuns.forEach((f) => f.members.forEach((m) => set.add(m)));
  return set;
}
function heardGroup(g) {
  return [...heardIds()].some((id) => byId(id).group === g);
}
function claimCovered(cid) {
  const heard = heardIds();
  const nStu = [...heard].filter((id) => byId(id).group === "student").length;
  const nTch = [...heard].filter((id) => byId(id).group !== "student").length;
  const stuSurvey = S.surveys.includes("stu_stu"); // students reporting their own use
  const tchSurvey = S.surveys.includes("tch_tch"); // teachers reporting their own use
  const stuFocus = S.focusRuns.some((f) => f.group === "student");
  const tchFocus = S.focusRuns.some((f) => f.group === "teacher");
  switch (cid) {
    case "c1": return stuSurvey || nStu >= 2 || stuFocus;
    case "c2": return tchSurvey || nTch >= 3 || tchFocus;
    case "c3": return tchSurvey || nTch >= 2 || tchFocus;
    case "c4": {
      const sayDo = S.observed.some((o) => heard.has(o));
      const probes = S.probesFound.some((p) => ["david", "roni", "rami", "yael"].includes(p));
      const contrast = S.focusRuns.some((f) => f.written);
      // the cross questionnaires expose the same gap from the outside
      const crossGap = S.surveys.includes("stu_tch") ||
        (S.surveys.includes("stu_stu") && S.surveys.includes("tch_stu"));
      return sayDo || probes || contrast || crossGap;
    }
    case "c5": {
      const policyAsked = Object.values(S.askedTopics).filter((ts) => ts.includes("policy")).length;
      return stuSurvey || tchSurvey || policyAsked >= 2;
    }
    case "c6": return stuSurvey || nStu >= 3;
    case "c7": {
      const voices = ["yossi", "salma", "galit", "eliya", "amal", "lina"].some((id) => heard.has(id));
      const seen = S.observed.some((o) => ["galit", "lina"].includes(o));
      return voices || seen || stuSurvey;
    }
    case "c8": {
      const measurers = ["chani", "orly", "itai"].some((id) => heard.has(id));
      const policyAsked = Object.values(S.askedTopics).filter((ts) => ts.includes("policy")).length;
      return measurers || policyAsked >= 2;
    }
  }
  return false;
}

function computeScores() {
  const R = { align: 0, tri: 0, calib: 0, notes: {}, strengths: [] };
  const heard = heardIds();
  const cntOf = (g) => [...heard].filter((id) => byId(id).group === g).length;
  const focusOf = (g) => S.focusRuns.some((f) => f.group === g);
  const nStu = cntOf("student");
  const nTch = cntOf("teacher");
  const nMgmt = cntOf("mgmt");
  // questionnaires, classified by who they are ABOUT
  const surveysAbout = (p) => S.surveys.filter((k) => SURVEY[k].about === p);
  const selfSurvey = { student: S.surveys.includes("stu_stu"), teacher: S.surveys.includes("tch_tch") };
  const otherSurvey = { student: S.surveys.includes("tch_stu"), teacher: S.surveys.includes("stu_tch") };
  const labelOf = { student: L("תלמידים", "students"), teacher: L("מורים", "teachers") };

  // ===== 1. התאמת השיטות לשאלת המחקר =====
  // Relevance is judged by who the evidence is ABOUT, not only by who produced it.
  (function () {
    const rq = RQS[S.rq] || RQS.rq6;
    const missing = [];
    let total = 0;
    rq.pops.forEach((p) => {
      const n = cntOf(p);
      const depth = n >= 2 || focusOf(p);
      let s = 0;
      if (selfSurvey[p]) s += 2;          // that population reporting on itself
      if (otherSurvey[p]) s += 1;         // the other group asked about that population
      if (depth) s += rq.mode === "perception" ? 2 : 1;
      if (n >= 4) s += 1;
      if (s === 0) missing.push(labelOf[p]);
      total += Math.min(4, s);
    });
    if (rq.pops.length > 1) total = Math.round(total / 2);
    if (S.observed.length) total += 1;
    if (missing.length) total = Math.min(total, 2);
    R.align = Math.max(0, Math.min(5, total));

    // ---- explanation: what fit the question and what did not ----
    // The key test: was the data ABOUT the population the question asks about?
    const plural = { student: L("תלמידים", "students"), teacher: L("מורים", "teachers") };
    const other = { student: "teacher", teacher: "student" };
    const fit = [], unfit = [], add = [];
    const ivCnt = (g) => S.interviewed.filter((id) => byId(id).group === g).length;
    const one = { student: L("תלמיד/ה אחד/ת", "one student"), teacher: L("מורה אחד/ת", "one teacher") };
    rq.pops.forEach((p) => {
      if (selfSurvey[p]) fit.push(L("שאלון שבו " + plural[p] + " דיווחו על עצמם — מידע ישיר על " + plural[p] + ".", "A questionnaire in which " + plural[p] + " reported on themselves — direct information about " + plural[p] + "."));
      if (otherSurvey[p]) fit.push(L("שאלון שבו " + plural[other[p]] + " דיווחו על " + plural[p] + " — גם הוא מידע על " + plural[p] + ", מנקודת מבט חיצונית.", "A questionnaire in which " + plural[other[p]] + " reported on " + plural[p] + " — this, too, is information about " + plural[p] + ", from an outside point of view."));
      const n = ivCnt(p);
      if (n) fit.push(L((n === 1 ? "ראיון עם " + one[p] : "ראיונות עם " + n + " " + plural[p]) + " — מידע על " + plural[p] + " מפיהם.", (n === 1 ? "An interview with " + one[p] : "Interviews with " + n + " " + plural[p]) + " — information about " + plural[p] + " in their own words."));
      if (focusOf(p)) fit.push(L("קבוצת מיקוד עם " + plural[p] + ".", "A focus group with " + plural[p] + "."));
    });
    if (S.observed.length) fit.push(L("תצפיות בשיעורים — רואים בפועל מה קורה בכיתה, ולא רק מה מספרים.", "Lesson observations — you see what actually happens in class, not just what people tell you."));

    S.surveys.filter((k) => !rq.pops.includes(SURVEY[k].about)).forEach((k) => {
      unfit.push(L("השאלון ״" + SURVEY[k].short + "״ עוסק ב" + plural[SURVEY[k].about] + ", והשאלה עוסקת ב" + rq.pops.map((p) => plural[p]).join(" וב") + " — לכן הוא אינו עונה עליה.", "The questionnaire “" + SURVEY[k].short + "” is about " + plural[SURVEY[k].about] + ", while the question is about " + rq.pops.map((p) => plural[p]).join(" and ") + " — so it doesn't answer it."));
    });
    ["student", "teacher"].filter((p) => !rq.pops.includes(p)).forEach((p) => {
      const n = ivCnt(p), fg = focusOf(p);
      const who = L(n === 1 && !fg ? "ראיון עם " + one[p] : (n && fg ? "ראיונות וקבוצת מיקוד" : n ? "ראיונות" : "קבוצת מיקוד") + " עם " + plural[p], n === 1 && !fg ? "An interview with " + one[p] : (n && fg ? "Interviews and a focus group" : n ? "Interviews" : "A focus group") + " with " + plural[p]);
      if (n || fg) unfit.push(L(who + " — המרואיינים מספרים בעיקר על עצמם. על " + rq.pops.map((q) => plural[q]).join(" ועל ") + " הם יכולים למסור רק מנקודת מבט חיצונית.", who + " — the participants mostly talk about themselves. About " + rq.pops.map((q) => plural[q]).join(" and ") + ", they can only offer an outside point of view."));
    });
    const nMgmtIv = ivCnt("mgmt");
    if (nMgmtIv) unfit.push(L((nMgmtIv === 1 ? "ראיון עם בעל/ת תפקיד — מוסיף" : "ראיונות עם " + nMgmtIv + " בעלי תפקידים — מוסיפים") + " הקשר על המדיניות בבית הספר, אבל זה אינו מידע ישיר על " + rq.pops.map((q) => plural[q]).join(" ועל ") + ".", (nMgmtIv === 1 ? "An interview with a member of the management and support staff — adds" : "Interviews with " + nMgmtIv + " members of the management and support staff — add") + " context about school policy, but this is not direct information about " + rq.pops.map((q) => plural[q]).join(" or ") + "."));

    missing.forEach((m) => add.push(L("לא נאסף שום מידע על " + m + ", ולכן אי אפשר לענות על השאלה לגביהם.", "No information at all was collected about " + m + ", so the question can't be answered for them.")));
    if (rq.mode === "usage") {
      rq.pops.filter((p) => !selfSurvey[p] && !otherSurvey[p] && !missing.includes(plural[p])).forEach((p) => {
        add.push(L("שאלון על " + plural[p] + " (של " + plural[p] + " על עצמם או של " + plural[other[p]] + " עליהם). השאלה היא מהם סוגי השימוש — ובלי שאלון אי אפשר לדעת כמה " + plural[p] + " משתמשים בכל סוג. ראיונות מראים אילו שימושים ומטרות קיימים, אבל רק אצל מי שרואיין.", "A questionnaire about " + plural[p] + " (answered by " + plural[p] + " about themselves, or by " + plural[other[p]] + " about them). The question asks how they use AI and for what purposes — and without a questionnaire there is no way to know how many " + plural[p] + " use it in each way. Interviews show which uses and purposes exist, but only among those who were interviewed."));
      });
    } else {
      rq.pops.filter((p) => cntOf(p) < 2 && !focusOf(p) && !missing.includes(plural[p])).forEach((p) => {
        add.push(L("ראיונות או קבוצת מיקוד עם " + plural[p] + ". שאלה על תפיסות דורשת לשמוע את ההסברים שלהם במילים שלהם — שאלון מראה כמה חושבים משהו, אבל לא למה.", "Interviews or a focus group with " + plural[p] + ". A question about perceptions requires hearing their explanations in their own words — a questionnaire shows how many people think something, but not why."));
      });
    }

    const block = (title, arr) => arr.length ? "<b>" + title + "</b><ul>" + arr.map((t) => "<li>" + t + "</li>").join("") + "</ul>" : "";
    R.notes.align =
      block(L("✔ מה התאים לשאלת המחקר", "✔ What fit the research question"), fit.length ? fit : []) +
      (fit.length ? "" : L("<p><b>✔ מה התאים לשאלת המחקר:</b> לא נאספו נתונים על האוכלוסייה שהשאלה עוסקת בה.</p>", "<p><b>✔ What fit the research question:</b> No data was collected about the population the question concerns.</p>")) +
      block(L("✘ מה לא התאים לשאלת המחקר", "✘ What didn't fit the research question"), unfit) +
      block(L("➕ מה היה מחזק את התשובה", "➕ What would have strengthened the answer"), add);
  })();

  // ===== 2. טריאנגולציה =====
  // Three kinds: across method families, within a method (different variants), and across viewpoints.
  (function () {
    const fams = [];
    if (S.interviewed.length) fams.push(L("ראיונות", "interviews"));
    if (S.focusRuns.length) fams.push(L("קבוצות מיקוד", "focus groups"));
    if (S.observed.length) fams.push(L("תצפיות", "observations"));
    if (S.surveys.length) fams.push(L("שאלונים", "questionnaires"));
    const ivVariety = new Set(S.ivTypes).size >= 2;
    const obsVariety = new Set(S.obsModes).size >= 2;
    const twoSides = nStu > 0 && nTch > 0;
    const withRoles = nTch > 0 && nMgmt > 0;
    const crossSurvey = S.surveys.some((k) => SURVEY[k].respondents === SURVEY[k].about) &&
                        S.surveys.some((k) => SURVEY[k].respondents !== SURVEY[k].about);
    const sayDo = S.observed.some((o) => heard.has(o));

    let t = 0;
    if (fams.length >= 2) t += Math.min(2, fams.length - 1);
    if (ivVariety || obsVariety) t += 1;
    if (twoSides) t += 1;
    if (withRoles || crossSurvey) t += 1;
    if (sayDo) t += 1;
    R.tri = Math.max(0, Math.min(5, t));

    const done = [];
    if (fams.length >= 2) done.push(L("שילבת " + fams.length + " סוגי שיטות (" + fams.join(", ") + ")", "You combined " + fams.length + " types of method (" + fams.join(", ") + ")"));
    if (ivVariety) done.push(L("השתמשת ביותר מסוג ראיון אחד", "You used more than one type of interview"));
    if (obsVariety) done.push(L("ערכת תצפיות בתצורות שונות", "You ran observations in different configurations"));
    if (twoSides) done.push(L("הצלבת נקודות מבט של מורים ותלמידים", "You cross-checked the points of view of teachers and students"));
    if (withRoles) done.push(L("שמעת גם בעלי תפקידים לצד מורים", "You also heard management and support staff alongside teachers"));
    if (crossSurvey) done.push(L("הצלבת דיווח עצמי מול תפיסה של הקבוצה האחרת", "You cross-checked self-report against the other group's perception"));
    if (sayDo) done.push(L("בדקת אמירה מול עשייה אצל אותו אדם", "You checked what the same person says against what they do"));

    R.notes.tri = done.length
      ? L("טריאנגולציה היא הצלבה: בין שיטות שונות, בין סוגים שונים של אותה שיטה, ובין נקודות מבט שונות. אצלך: " + done.join("; ") + ".", "Triangulation is cross-checking: between different methods, between different types of the same method, and between different points of view. In your case: " + done.map((d) => d.charAt(0).toLowerCase() + d.slice(1)).join("; ") + ".")
      : L("טריאנגולציה היא הצלבה: בין שיטות שונות, בין סוגים שונים של אותה שיטה (סוגי ראיון או סוגי תצפית), ובין נקודות מבט שונות (מורים מול תלמידים, מורים מול בעלי תפקידים). במערך הזה כמעט ולא הייתה הצלבה — לממצא בודד אין במה להיבחן.", "Triangulation is cross-checking: between different methods, between different types of the same method (types of interview or types of observation), and between different points of view (teachers versus students, teachers versus management and support staff). This design had almost no cross-checking — a single finding has nothing to be tested against.");
    R.strengths = done;
  })();

  // ===== 3. כיול הביטחון =====
  let pts = 0;
  CLAIMS.forEach((cl) => {
    const a = S.answers[cl.id];
    const cov = claimCovered(cl.id);
    if (a.v === "na") pts += cov ? 0.5 : 1;
    else if ((a.v === "t") === cl.truth) pts += cov ? 1 : 0.5;
    else pts += a.conf === "high" ? 0 : 0.15;
  });
  R.calib = Math.round((pts / CLAIMS.length) * 5 * 10) / 10;
  R.notes.calib = L("ביטחון מוצדק = ראיות. ״אין לי מספיק ראיות״ על טענה שלא נחקרה שווה יותר מניחוש מוצלח.", "Justified confidence = evidence. “I don't have enough evidence” about a claim you didn't investigate is worth more than a lucky guess.");
  return R;
}

// Which research questions each reveal is relevant to: "population" or "population:mode"; "any" = every question.
const REVEAL_SCOPE = {
  maya_silenced: ["student"], itamar_perf: ["student"], yossi_missed: ["student"],
  no_access_story: ["student"], no_kobi: ["student"], no_students: ["student"], no_survey_stu: ["student"],
  no_david_obs: ["teacher"], mgmt_role: ["teacher"], amal_missed: ["teacher"], no_itai: ["teacher"],
  no_teachers: ["teacher"], no_survey_tch: ["teacher"],
  no_chani: ["teacher:perception"],
  cross_survey_gap: ["student", "teacher:perception"],
  leading_qs: ["any"],
};
function activeReveals() {
  const out = [];
  const heard = heardIds();
  // pushed in priority order — most specific / design-caused first
  const badFocus = S.focusRuns.some((f) => f.group === "student" && f.members.includes("maya") && f.members.includes("rami") && !f.ordered && !f.written);
  if (badFocus) out.push("maya_silenced");
  if (S.focusRuns.some((f) => f.members.includes("itamar") && !f.written)) out.push("itamar_perf");
  if (heard.has("amal") && !S.probesFound.includes("amal")) out.push("amal_missed");
  if (!heard.has("chani")) out.push("no_chani");
  if (!heard.has("itai") && !S.surveys.length) out.push("no_itai");
  if (!heard.has("kobi")) out.push("no_kobi");
  if (!["yossi", "salma", "galit", "eliya", "amal"].some((id) => heard.has(id)) &&
      !S.observed.some((o) => ["galit", "lina"].includes(o))) out.push("no_access_story");
  if (!S.observed.includes("david")) out.push("no_david_obs");
  if (S.surveys.length && !(S.surveys.includes("stu_stu") && S.surveys.includes("tch_stu"))) out.push("cross_survey_gap");
  if (!S.surveys.length) { out.push("no_survey_stu"); out.push("no_survey_tch"); }
  if (S.role === "mgmt") out.push("mgmt_role");
  if (![...heard].some((id) => byId(id).group === "student")) out.push("no_students");
  if (![...heard].some((id) => byId(id).group !== "student")) out.push("no_teachers");
  if (!S.probesFound.includes("yossi") && !S.observed.includes("lina")) out.push("yossi_missed");
  if (S.leadingCount >= 2) out.push("leading_qs");
  // show only what the researcher missed regarding the selected research question
  const rq = RQS[S.rq] || RQS.rq6;
  const relevant = (k) => (REVEAL_SCOPE[k] || []).some((tag) => {
    const [pop, mode] = tag.split(":");
    return (pop === "any" || rq.pops.includes(pop)) && (!mode || mode === rq.mode);
  });
  return out.filter(relevant).map((k) => REVEALS.find((r) => r.key === k)).filter(Boolean).slice(0, 5);
}

      <h4 class="substep">${L("אופן התחלת הדיון", "How the discussion begins")}</h4>
      <div class="cards2">
        <button class="card ${v.written ? "sel" : ""}" onclick="fgOpt('written',true)"><b>${L("כתיבה אישית לפני הדיון", "Individual writing before the discussion")}</b><span>${L("כל משתתף כותב עמדה אנונימית, ואז דיון", "Each participant writes an anonymous position, then the discussion")}</span></button>
        <button class="card ${v.written === false ? "sel" : ""}" onclick="fgOpt('written',false)"><b>${L("ישר לדיון", "Straight to discussion")}</b><span>${L("בלי שלב כתיבה", "No writing stage")}</span></button>
      </div>
      <h4 class="substep">${L("דיבור לפי הסדר או פופקורן", "Speaking in turn, or popcorn style")}</h4>
      <div class="cards2">
        <button class="card ${v.ordered ? "sel" : ""}" onclick="fgOpt('ordered',true)"><b>${L("דיבור לפי סדר", "Speaking in turn")}</b><span>${L("לכל אחד תור מובטח", "Everyone gets a guaranteed turn")}</span></button>
        <button class="card ${v.ordered === false ? "sel" : ""}" onclick="fgOpt('ordered',false)"><b>${L("דיון חופשי (פופקורן)", "Free discussion (popcorn)")}</b><span>${L("מי שמדבר — מדבר", "Whoever speaks up, speaks")}</span></button>
      </div>
      <button class="btn primary" ${v.members.length >= 5 && v.members.length <= 8 && v.written !== null && v.ordered !== null ? "" : "disabled"}
        onclick="fgRun()">${L("פתיחת הקבוצה (" + v.members.length + " משתתפים)", "Open the group (" + v.members.length + " participants)")}</button>
      ${cancelBtn()}</section>`;
  }
  const t = v.result;
  return `<section class="panel"><h2>${L("👥 קבוצת מיקוד — פרוטוקול", "👥 Focus group — transcript")}</h2>
    ${v.written ? `<h3>${L("יומן חוקר על הכרטיסים האנונימיים שנאספו לפני הדיון", "Researcher's log of the anonymous cards collected before the discussion")}</h3>
      ${t.cards.map((id, i) => `<div class="quote small">${L("כרטיס", "Card")} ${i + 1}: ${byId(id).card}</div>`).join("")}<h3>${L("הדיון", "The discussion")}</h3>` : ""}
    ${t.lines.map(fgLine).map((l) => `<div class="fgline ${l.mute ? "mute" : ""}"><b>${l.who}${l.tag ? ` (${l.tag})` : ""}:</b> ${l.text}</div>`).join("")}
    ${t.silenced.length && !v.written ? `<p class="hint">${L("שימו לב מי לא דיבר. האם שתיקה היא הסכמה?", "Notice who didn't speak. Is silence agreement?")}</p>` : ""}
    <button class="btn primary" onclick="fgDone()">${backLabel()}</button></section>`;
}

// ---------- conclusions ----------
function concludeScreen() {
  if (!S.answers) S.answers = Object.fromEntries(CLAIMS.map((c) => [c.id, { v: null, conf: "med" }]));
  const done = CLAIMS.every((c) => S.answers[c.id].v);
  return `<div class="wrap"><section class="panel">
    <h2>${L("מסקנות המחקר", "Research conclusions")}</h2>
    <p class="lead">${L(
      "על סמך הראיות שאספתם שפטו כל טענה. אפשרות ״אין לי מספיק ראיות״ היא תשובה לגיטימית של חוקר, לא כישלון. לוח הראיות מוצג למטה.",
      "Judge each claim on the basis of the evidence you collected. “I don't have enough evidence” is a legitimate answer for a researcher, not a failure. The evidence board is shown below."
    )}</p>
    ${CLAIMS.map((c) => {
      const a = S.answers[c.id];
      return `<div class="claim"><p><b>${c.text}</b></p>
      <div class="chips">
        <button class="chip ${a.v === "t" ? "sel" : ""}" onclick="ansSet('${c.id}','t')">${L("נכון", "True")}</button>
        <button class="chip ${a.v === "f" ? "sel" : ""}" onclick="ansSet('${c.id}','f')">${L("לא נכון", "False")}</button>
        <button class="chip ${a.v === "na" ? "sel" : ""}" onclick="ansSet('${c.id}','na')">${L("אין לי מספיק ראיות", "I don't have enough evidence")}</button>
      </div>
      ${a.v && a.v !== "na" ? `<div class="chips conf">${L("רמת ביטחון:", "Confidence level:")}
        <button class="chip ${a.conf === "low" ? "sel" : ""}" onclick="confSet('${c.id}','low')">${L("נמוכה", "Low")}</button>
        <button class="chip ${a.conf === "med" ? "sel" : ""}" onclick="confSet('${c.id}','med')">${L("בינונית", "Medium")}</button>
        <button class="chip ${a.conf === "high" ? "sel" : ""}" onclick="confSet('${c.id}','high')">${L("גבוהה", "High")}</button></div>` : ""}
      </div>`;
    }).join("")}
    <button class="btn primary big" ${done ? "" : "disabled"} onclick="submitAnswers()">${L("הגשת דוח המחקר ←", "Submit the research report →")}</button>
  </section>
  ${evidencePanel()}</div>`;
}

// ---------- debrief ----------
function scoreBar(v) {
  return `<span class="sbar"><span class="sfill" style="width:${(v / 5) * 100}%"></span></span><b class="sval">${v}/5</b>`;
}
function debriefScreen() {
  const R = S.scores;
  const dims = [["align", L("התאמת השיטות לשאלת המחקר", "Fit of the methods to the research question")], ["tri", L("טריאנגולציה", "Triangulation")], ["calib", L("כיול הביטחון", "Confidence calibration")]];
  const ansLabel = { t: L("נכון", "True"), f: L("לא נכון", "False"), na: L("אין מספיק ראיות", "Not enough evidence") };
  const confLabel = { low: L("נמוכה", "Low"), med: L("בינונית", "Medium"), high: L("גבוהה", "High") };
  return `<div class="wrap">
  <section class="panel"><h2>${L("תחקיר מתודולוגי", "Methodological debrief")}</h2>
    ${dims.map(([k, label]) => `<div class="srow"><span class="slabel">${label}</span>${scoreBar(R[k])}<div class="snote">${R.notes[k]}</div></div>`).join("")}
  </section>
  <section class="panel"><h2>${L("שיפוט הטענות", "Judging the claims")}</h2>
    ${CLAIMS.map((c) => {
      const a = S.answers[c.id];
      const cov = claimCovered(c.id);
      let verdict;
      if (a.v === "na") verdict = cov
        ? L("⚖️ בחרת ״אין ראיות״ — אבל דווקא היו לך ראיות רלוונטיות.", "⚖️ You chose “not enough evidence” — but you did in fact have relevant evidence.")
        : L("✅ צניעות מוצדקת: המערך שלך באמת לא כיסה את הטענה. זו תשובה מדעית מצוינת.", "✅ Justified humility: your design really didn't cover this claim. That is an excellent scientific answer.");
      else if ((a.v === "t") === c.truth) verdict = cov
        ? L("✅ שיפוט נכון — ומבוסס על ראיות שאספת.", "✅ A correct judgment — and one grounded in evidence you collected.")
        : L("⚠️ שיפוט נכון... אבל ניחוש: הראיות שלך לא כיסו את הטענה הזאת.", "⚠️ A correct judgment... but a guess: your evidence didn't cover this claim.");
      else verdict = a.conf === "high"
        ? L("❌ שיפוט שגוי — ובביטחון גבוה. הצירוף המסוכן ביותר במחקר.", "❌ A wrong judgment — and with high confidence. The most dangerous combination in research.")
        : L("❌ שיפוט שגוי — אך לפחות בביטחון מדוד.", "❌ A wrong judgment — but at least with measured confidence.");
      const chose = `<p class="chose">${L("סימנתם:", "You marked:")} <b>${ansLabel[a.v]}</b>${a.v === "na" ? "" : ` · ${L("רמת ביטחון:", "Confidence level:")} <b>${confLabel[a.conf]}</b>`}</p>`;
      return `<div class="claim"><p><b>${c.text}</b></p>${chose}<p>${verdict}</p><p class="snote">${c.basis}</p></div>`;
    }).join("")}
  </section>
  <section class="panel"><h2>${L("יש לכל שיטת מחקר יתרונות וחסרונות", "Every research method has advantages and disadvantages")}</h2>
    <p class="hint">${L(
      "אין מערך מחקר מושלם. כל בחירה מאירה דבר אחד ומחשיכה אחר — ולכן שווה להסתכל קודם על מה שהמערך שלכם דווקא הצליח לעשות.",
      "There is no perfect research design. Every choice lights up one thing and leaves another in the dark — so it's worth looking first at what your design did manage to do."
    )}</p>
    <h3 class="strengthhead">${L("יתרונות וחוזקות של שיטת המחקר", "Advantages and strengths of your research approach")}</h3>
    ${R.strengths.length
      ? `<ul class="strengths">${R.strengths.map((t) => `<li>${t}</li>`).join("")}</ul>`
      : `<p>${L(
        "המערך שלכם היה ממוקד בשיטה אחת ובקבוצה אחת. יש לכך יתרון — עומק והיכרות — אבל בלי הצלבה קשה לדעת אם הממצא נכון או רק נשמע נכון.",
        "Your design focused on one method and one group. That has an advantage — depth and familiarity — but without cross-checking it's hard to know whether a finding is true or only sounds true."
      )}</p>`}
    <div class="tri-note">
      <p>${L(
        "<b>טריאנגולציה</b> היא הכוח המרכזי של מערך מחקר: הצלבה שמאפשרת לבדוק ממצא ביותר מדרך אחת. היא מתרחשת בשלושה מישורים:",
        "<b>Triangulation</b> is the central strength of a research design: cross-checking that lets you test a finding in more than one way. It happens on three levels:"
      )}</p>
      <ul>
        <li>${L(
          "<b>בין שיטות שונות</b> — ראיון, תצפית, קבוצת מיקוד ושאלון. מה שאדם אומר בראיון אפשר לבחון מול מה שנצפה בכיתה ומול מה שעולה בשאלון אנונימי.",
          "<b>Between different methods</b> — interview, observation, focus group and questionnaire. What a person says in an interview can be tested against what is observed in class and against what emerges in an anonymous questionnaire."
        )}</li>
        <li>${L(
          "<b>בין סוגים שונים של אותה שיטה</b> — גם זו טריאנגולציה. ראיון פתוח מול ראיון מובנה חושפים דברים שונים אצל אותו אדם; תצפית פתוחה מול תצפית כמותית, או משתתפת מול לא-משתתפת, מייצרות תמונות שונות של אותו שיעור.",
          "<b>Between different types of the same method</b> — this is triangulation too. An open interview and a structured interview reveal different things about the same person; open versus quantitative observation, or participant versus non-participant, produce different pictures of the same lesson."
        )}</li>
        <li>${L(
          "<b>בין נקודות מבט שונות</b> — מורים מול תלמידים, ומורים מול בעלי תפקידים. אותה תופעה נראית אחרת מחדר המורים, מהכיתה ומהמשרד, והפער בין המבטים הוא ממצא בפני עצמו ולא רעש.",
          "<b>Between different points of view</b> — teachers versus students, and teachers versus management and support staff. The same phenomenon looks different from the staff room, from the classroom and from the office, and the gap between the views is a finding in itself, not noise."
        )}</li>
      </ul>
      <p class="snote">${L(
        "כשהצלבה מניבה תשובות שונות, זה אינו כישלון של המחקר — זו לרוב הנקודה שבה מתחיל הממצא המעניין.",
        "When cross-checking yields different answers, that isn't a failure of the research — it is usually the point where the interesting finding begins."
      )}</p>
    </div>
  </section>
  <section class="panel reveal"><h2>${L("🔍 מה לא ראית", "🔍 What you didn't see")}</h2>
    <p class="hint">${L(
      "הצצה חלקית אל מאחורי הקלעים של בית הספר — רק במקומות שהמערך שלך השאיר חשוכים.",
      "A partial peek behind the scenes of the school — only in the places your design left in the dark."
    )}</p>
    ${activeReveals().map((r) => `<div class="quote">${r.text}</div>`).join("") || "<p>" + L(
      "המערך שלך כיסה את נקודות העיוורון המרכזיות. נסו עכשיו תפקיד אחר — ותגלו שגם זה משנה את הממצאים.",
      "Your design covered the main blind spots. Now try a different role — and you'll find that this, too, changes the findings."
    ) + "</p>"}
  </section>
  <section class="panel"><h2>${L("🪪 כרטיס המחקר שלי", "🪪 My research card")} <span class="opt">${L("(להשוואה בכיתה)", "(for comparing in class)")}</span></h2>
    <textarea id="rcard" class="rcard" readonly>${esc(researchCard())}</textarea>
    <div class="row"><button class="btn primary" onclick="copyCard()">${L("העתקת הכרטיס", "Copy the card")}</button>
    <button class="btn ghost" onclick="resetGame()">${L("🔁 מחקר חדש — באסטרטגיה אחרת", "🔁 New study — with a different strategy")}</button></div>
    <p class="hint">${L(
      "שחקו שוב בתפקיד אחר, בשאלה אחרת או בשיטות אחרות — ובדקו אם הגעתם לאותן מסקנות.",
      "Play again in a different role, with a different question or with different methods — and check whether you reach the same conclusions."
    )}</p>
  </section></div>`;
}

function researchCard() {
  const R = S.scores;
  const ansTxt = { t: L("נכון", "True"), f: L("לא נכון", "False"), na: L("אין מספיק ראיות", "Not enough evidence") };
  return [
    L(`כרטיס מחקר — תיכון אופק`, `Research card — Ofek High School`),
    L(`תפקיד: ${ROLES[S.role].name} | שאלה: ${RQS[S.rq].text}`, `Role: ${ROLES[S.role].name} | Question: ${RQS[S.rq].text}`),
    L(`שיטות: ראיונות ${S.interviewed.length} | קבוצות מיקוד ${S.focusRuns.length} | תצפיות ${S.observed.length} | סקרים ${S.surveys.length}`,
      `Methods: interviews ${S.interviewed.length} | focus groups ${S.focusRuns.length} | observations ${S.observed.length} | surveys ${S.surveys.length}`),
    L(`מסקנות: `, `Conclusions: `) + CLAIMS.map((c, i) => `(${i + 1}) ${ansTxt[S.answers[c.id].v]}`).join(" "),
    L(`ציונים: התאמה לשאלה ${R.align} | טריאנגולציה ${R.tri} | כיול ${R.calib}`,
      `Scores: fit to question ${R.align} | triangulation ${R.tri} | calibration ${R.calib}`),
  ].join("\n");
}

// ---------- modal ----------
function modalHtml() {
  return `<div class="mback" onclick="closeGuide()"><div class="modal" onclick="event.stopPropagation()">
    <h2>${L("📘 מדריך השיטות הקצר", "📘 Short methods guide")}</h2>
    ${Object.values(GUIDE).map((g) => `<p>• ${g}</p>`).join("")}
    <button class="btn primary" onclick="closeGuide()">${L("סגירה", "Close")}</button>
  </div></div>`;
}
const cancelBtn = () => `<button class="btn ghost" onclick="cancelAction()">${L("ביטול (בלי עלות)", "Cancel (no cost)")}</button>`;

// ---------- handlers ----------
window.setLang = setLang;
window.pickRole = (k) => { UI.pick.role = k; render(); };
window.pickRQ = (k) => { UI.pick.rq = k; render(); };
window.openGuide = () => { UI.modal = true; render(); };
window.closeGuide = () => { UI.modal = null; render(); };
window.startDay = () => { newGame(String(Date.now()), UI.pick.role, UI.pick.rq); render(); };
window.backHub = () => { S.view = { name: "hub" }; render(); };
window.cancelAction = () => { S.time += S.view.paid || 0; S.view = { name: "hub" }; render(); };
window.endDay = () => { S.screen = "conclude"; render(); };
// Starts over without reloading the page, so the chosen language is kept.
window.resetGame = () => { S = null; UI = { pick: {}, modal: null }; render(); window.scrollTo(0, 0); };

window.goAction = (key) => {
  const cost = METHOD_COSTS[key];
  if (!canAfford(cost)) return;
  spend(cost);
  if (key === "corridor") {
    const snips = [0, 1].map(() => S.corridorOrder[S.corridorUsed++ % CORRIDOR.length]); // indices into CORRIDOR
    S.view = { name: "corridor", snips, paid: cost };
    addEvidence({
      method: () => L("סיור", "Corridor walk"),
      title: () => L("רשמים מהמסדרון", "Impressions from the corridor"),
      lines: () => snips.map((i) => CORRIDOR[i]),
    });
  } else if (key === "observe") S.view = { name: "observe", paid: cost };
  else if (key === "interview") S.view = { name: "interview", paid: cost };
  else if (key === "focus") S.view = { name: "focus", group: null, members: [], written: null, ordered: null, paid: cost };
  else if (key === "survey") S.view = { name: "survey", paid: cost };
  render();
};

// observation
window.obsPick = (k, val) => { S.view[k === "lesson" ? "lesson" : k] = val; render(); };
window.obsDone = () => {
  const v = S.view, lesson = v.lesson, struct = v.struct, inv = v.inv;
  S.observed.push(lesson);
  S.obsModes.push(struct + "/" + inv);
  addEvidence({
    method: () => struct === "structured" ? L("תצפית כמותית", "Quantitative observation")
      : struct === "open" ? L("תצפית פתוחה", "Open observation") : L("תצפית ממוקדת", "Focused observation"),
    title: () => OBSERVATIONS[lesson].title,
    lines: () => {
      const o = OBSERVATIONS[lesson];
      const lines = struct === "structured" ? [o.structured.count, o.structured.note] : [o[struct]];
      if (inv === "part") lines.push(L("אפקט המשתתף: ", "Participant effect: ") + o.participant);
      return lines;
    },
  });
  backHub();
};

// interview
window.ivPick = (id) => { S.view.who = id; render(); };
window.ivType = (t) => {
  const v = S.view;
  v.type = t; v.log = []; v.asked = []; v.stage = "topics"; v.pendTopic = null; v.probed = false;
  v.quota = t === "open" ? 2 : t === "semi" ? 3 : 4;
  if (t === "structured") {
    const ch = byId(v.who);
    ["use", "learning", "assess", "policy"].forEach((topic) => {
      v.asked.push(topic);
      v.log.push({ topic, wording: "neutral", variant: interviewVariant(ch, topic, "neutral", "structured") });
    });
    v.stage = "wrap";
  }
  render();
};
window.ivTopic = (t) => { S.view.pendTopic = t; render(); };
window.ivAsk = (wording) => {
  const v = S.view, ch = byId(v.who), t = v.pendTopic;
  v.asked.push(t);
  v.log.push({ topic: t, wording, variant: interviewVariant(ch, t, wording, v.type) });
  v.pendTopic = null;
  if (v.asked.length >= v.quota) v.stage = "wrap";
  render();
};
window.ivProbe = () => {
  const v = S.view, ch = byId(v.who);
  v.probed = true;
  v.log.push({ probe: true });
  S.probesFound.push(ch.id);
  render();
};
window.ivFinish = () => {
  const v = S.view, ch = byId(v.who), type = v.type, log = v.log.slice();
  if (!S.interviewed.includes(ch.id)) S.interviewed.push(ch.id);
  S.ivTypes.push(type);
  S.askedTopics[ch.id] = (S.askedTopics[ch.id] || []).concat(v.asked);
  addEvidence({
    method: () => ivTypeName(type),
    title: () => ch.name + " · " + ch.tag,
    // In English a follow-up reveal is narration that already carries its own quotation marks.
    lines: () => log.map((e) => logQA(ch, e)).map((l) => (LANG === "en" && l.probe ? l.a : qt(l.a))),
  });
  backHub();
};

// focus group
window.fgGroup = (g) => { S.view.group = g; render(); };
window.fgToggle = (id) => {
  const m = S.view.members;
  const i = m.indexOf(id);
  if (i >= 0) m.splice(i, 1); else if (m.length < 8) m.push(id);
  render();
};
window.fgOpt = (k, val) => { S.view[k] = val; render(); };
window.fgRun = () => {
  const v = S.view;
  v.result = focusTranscript(v.members, v.written, v.ordered);
  v.confirmed = true;
  render();
};
window.fgDone = () => {
  const v = S.view, group = v.group, n = v.members.length, written = v.written, res = v.result;
  S.focusRuns.push({ group, members: v.members.slice(), written, ordered: v.ordered });
  addEvidence({
    method: () => L("קבוצת מיקוד", "Focus group"),
    title: () => (group === "student" ? L("תלמידים", "Students") : L("צוות", "Staff")) + " · " + n + L(" משתתפים", " participants"),
    lines: () => {
      const lines = res.lines.map(fgLine).map((l) => l.who + (l.tag ? " (" + l.tag + ")" : "") + ": " + l.text);
      if (written) lines.unshift(L("כרטיסים אנונימיים: ", "Anonymous cards: ") + res.cards.map((id) => byId(id).card).join(" | "));
      return lines;
    },
  });
  backHub();
};

// survey
window.svPop = (p) => { S.view.pop = p; render(); };
window.svDone = () => {
  const pop = S.view.pop;
  S.surveys.push(pop);
  addEvidence({
    method: () => L("סקר אנונימי", "Anonymous survey"),
    title: () => surveyResults(pop).title,
    lines: () => surveyResults(pop).items.map((it) => it.label + ": " + it.pct + "%"),
  });
  backHub();
};

// conclusions
window.ansSet = (id, val) => { S.answers[id].v = val; render(); };
window.confSet = (id, val) => { S.answers[id].conf = val; render(); };
window.submitAnswers = () => { S.scores = computeScores(); S.screen = "debrief"; render(); };
window.copyCard = () => {
  const ta = document.getElementById("rcard");
  ta.select();
  try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand("copy"); }
};

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
